<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI DevOps Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Theme initializer v2: force-resets existing users to light mode, prevents flash -->
    <script>
      (function () {
        try {
          var THEME_KEY    = 'devops_copilot_theme';
          var MIGRATE_KEY  = 'devops_theme_reset_v2'; // bump this to force-reset again

          // One-time migration: if user never had the migration flag, reset to light
          if (!localStorage.getItem(MIGRATE_KEY)) {
            localStorage.setItem(THEME_KEY, 'light');
            localStorage.setItem(MIGRATE_KEY, '1');
          }

          var saved = localStorage.getItem(THEME_KEY);
          if (!saved) { localStorage.setItem(THEME_KEY, 'light'); saved = 'light'; }

          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          // Private browsing / storage blocked — default to light
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background font-body text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
